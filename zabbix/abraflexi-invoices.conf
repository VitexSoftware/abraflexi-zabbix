# AbraFlexi Zabbix monitoring configuration for unsent invoices
# Add this to your Zabbix agent configuration

# Unsent invoices monitoring using ShowUnsent.php script
UserParameter=abraflexi.invoices.unsent[*],/usr/bin/php -f /usr/share/abraflexi-mailer/src/ShowUnsent.php 2>/dev/null | jq -r '.metrics.$1 // "0"' 2>/dev/null || echo "0"
UserParameter=abraflexi.invoices.unsent.status,/usr/bin/php -f /usr/share/abraflexi-mailer/src/ShowUnsent.php 2>/dev/null | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown"
UserParameter=abraflexi.invoices.unsent.message,/usr/bin/php -f /usr/share/abraflexi-mailer/src/ShowUnsent.php 2>/dev/null | jq -r '.message // "No data"' 2>/dev/null || echo "No data"

# Individual metrics for easier monitoring
UserParameter=abraflexi.invoices.unsent.total,/usr/bin/php -f /usr/share/abraflexi-mailer/src/ShowUnsent.php 2>/dev/null | jq -r '.metrics.total_unsent // "0"' 2>/dev/null || echo "0"
UserParameter=abraflexi.invoices.unsent.companies,/usr/bin/php -f /usr/share/abraflexi-mailer/src/ShowUnsent.php 2>/dev/null | jq -r '.metrics.companies_affected // "0"' 2>/dev/null || echo "0"