# AbraFlexi Digest — business metrics for Zabbix
# Install to /etc/zabbix/zabbix_agent2.d/abraflexi-digest.conf
# Requires: abraflexi-zabbix package with digest-modules support

# All metrics as JSON (for dependent items)
UserParameter=abraflexi.digest.all,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest 2>/dev/null || echo "{}"

# Debtors
UserParameter=abraflexi.digest.debtors.count,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest debtors.count 2>/dev/null || echo "0"
UserParameter=abraflexi.digest.debtors.total_amount,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest debtors.total_amount 2>/dev/null || echo "0"
UserParameter=abraflexi.digest.debtors.max_overdue_days,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest debtors.max_overdue_days 2>/dev/null || echo "0"

# Waiting income (unpaid outcoming invoices)
UserParameter=abraflexi.digest.waiting_income.count,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest waiting_income.count 2>/dev/null || echo "0"
UserParameter=abraflexi.digest.waiting_income.total_amount,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest waiting_income.total_amount 2>/dev/null || echo "0"

# Waiting payments (unpaid incoming invoices)
UserParameter=abraflexi.digest.waiting_payments.count,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest waiting_payments.count 2>/dev/null || echo "0"
UserParameter=abraflexi.digest.waiting_payments.total_amount,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest waiting_payments.total_amount 2>/dev/null || echo "0"

# Unmatched payments
UserParameter=abraflexi.digest.unmatched_payments.count,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest unmatched_payments.count 2>/dev/null || echo "0"
UserParameter=abraflexi.digest.unmatched_payments.total_amount,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest unmatched_payments.total_amount 2>/dev/null || echo "0"

# Invoice counts (period)
UserParameter=abraflexi.digest.incoming_invoices.count,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest incoming_invoices.count 2>/dev/null || echo "0"
UserParameter=abraflexi.digest.outcoming_invoices.count,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest outcoming_invoices.count 2>/dev/null || echo "0"

# Payment counts (period)
UserParameter=abraflexi.digest.incoming_payments.count,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest incoming_payments.count 2>/dev/null || echo "0"
UserParameter=abraflexi.digest.outcoming_payments.count,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest outcoming_payments.count 2>/dev/null || echo "0"

# Last run timestamp
UserParameter=abraflexi.digest.last_run,/usr/bin/php -f /usr/share/abraflexi-zabbix/bin/abraflexi-zabbix-digest last_run 2>/dev/null || echo "0"
