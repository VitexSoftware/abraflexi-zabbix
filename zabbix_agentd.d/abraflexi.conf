# This file is part of abraflexi-zabbix package
# AbraFlexi Zabbix monitoring configuration

# Low Level Discovery - Company listing
UserParameter=abraflexi.company.lld,abraflexi-zabbix-lld-company

# System Status Metrics from /status.json endpoint (CACHED - 30 second TTL)
# All metrics use the same cached data source to minimize server load
UserParameter=abraflexi.system.version,abraflexi-zabbix-status version
UserParameter=abraflexi.system.licenseName,abraflexi-zabbix-status licenseName
UserParameter=abraflexi.system.licenseVariant,abraflexi-zabbix-status licenseVariant
UserParameter=abraflexi.system.licensingMethod,abraflexi-zabbix-status licensingMethod
UserParameter=abraflexi.system.loggedUser,abraflexi-zabbix-status loggedUser
UserParameter=abraflexi.system.loggedUserRO,abraflexi-zabbix-status loggedUserRO
UserParameter=abraflexi.system.loggedUserRW,abraflexi-zabbix-status loggedUserRW
UserParameter=abraflexi.system.sessions,abraflexi-zabbix-status sessions
UserParameter=abraflexi.system.sessionsRO,abraflexi-zabbix-status sessionsRO
UserParameter=abraflexi.system.sessionsRW,abraflexi-zabbix-status sessionsRW
UserParameter=abraflexi.system.bytesRead,abraflexi-zabbix-status bytesRead
UserParameter=abraflexi.system.bytesWritten,abraflexi-zabbix-status bytesWritten
UserParameter=abraflexi.system.memoryHeap,abraflexi-zabbix-status memoryHeap
UserParameter=abraflexi.system.memoryUsed,abraflexi-zabbix-status memoryUsed
UserParameter=abraflexi.system.systemLoad,abraflexi-zabbix-status systemLoad
UserParameter=abraflexi.system.appServerRunning,abraflexi-zabbix-status appServerRunning
UserParameter=abraflexi.system.totalGcTime,abraflexi-zabbix-status totalGcTime
UserParameter=abraflexi.system.responseTime,abraflexi-zabbix-status responseTime
UserParameter=abraflexi.system.javaVersion,abraflexi-zabbix-status javaVersion
UserParameter=abraflexi.system.operatingSystem,abraflexi-zabbix-status operatingSystem
UserParameter=abraflexi.system.uuid,abraflexi-zabbix-status uuid
UserParameter=abraflexi.system.startupTime,abraflexi-zabbix-status startupTime
UserParameter=abraflexi.system.centralServerDatabaseVersion,abraflexi-zabbix-status centralServerDatabaseVersion

# Configuration Information
UserParameter=abraflexi.config.url,abraflexi-zabbix-status configUrl
UserParameter=abraflexi.config.login,abraflexi-zabbix-status configLogin

# Network and Service Health Checks
UserParameter=abraflexi.network.connectivity,abraflexi-zabbix-network network
UserParameter=abraflexi.network.authentication,abraflexi-zabbix-network auth
UserParameter=abraflexi.network.service,abraflexi-zabbix-network service
UserParameter=abraflexi.network.overall,abraflexi-zabbix-network all

# Update information (testing & production)
UserParameter=abraflexi.update.latestTesting,/usr/lib/zabbix/externalscripts/abraflexi-update-testing.sh
UserParameter=abraflexi.update.latestProduction,/usr/lib/zabbix/externalscripts/abraflexi-update-production.sh

